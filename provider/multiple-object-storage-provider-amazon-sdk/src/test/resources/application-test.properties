# AWS S3 测试配置
# 请替换为你的实际配置
s3.bucket.name=test-bucket-name
s3.region=us-east-1
s3.endpoint=https://s3.amazonaws.com
s3.access.key=your-access-key-id
s3.secret.key=your-secret-access-key

# 阿里云 OSS 测试配置
